<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />				
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		
		<link rel="icon" type="image/png" href="/Browser.png">

		%sveltekit.head%
		

		
		<!--
		https://www.w3schools.com/css/tryit.asp?filename=tryresponsive_bootstrap
		Below is bootstrap
		-->
		<!-- Legg til Bootstrap5 CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

		<!-- Moderne skrifttype (Inter) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	
		<!-- Bootstrap forklaring
		 	Bootstrap deler breidda inn i 12 kolonner.
			Tala (4, 6, 12) seier kor mange av dei 12 elementet skal bruke.

			col-12 (standard / mobil) 			= 12 av 12 kolonner = 100% bredde
			col-sm-6 (små skjermer / nettbrett) = 6 av 12 kolonner 	= 50% bredde
			col-md-4 (medium skjermer / laptop) = 4 av 12 kolonner 	= 33.33% bredde	
		-->

		<!-- 
			bg-1: Background color of page
			bg-2: Background color of top header
			bg-3:
			fg-1: color of text in page in headers
			fg-2:
			fg-2:
			link: color of text in top header
			link-hover: color when mouse is over text in top header 
			link-active: color when text in top header is pressed
		-->

		<style>			
			html {
				scroll-behavior: smooth;
			}

			body {
				--bg-1: hsl(0, 0%, 100%);
				--bg-2: hsl(0, 0%, 100%);
				--bg-3: hsl(207, 70%, 44%);
				--fg-1: hsl(0, 0%, 0%);
				--fg-2: hsl(174, 16%, 26%);
				--fg-2: hsl(0, 68%, 45%);
				--link: hsl(0, 0%, 0%);
				--link-hover: hsl(124, 77%, 55%);
				--link-active: hsl(0, 0%, 0%);
				--accent: hsl(207, 90%, 48%);
				--border-radius: 8px;
				--font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
					'Open Sans', 'Helvetica Neue', sans-serif;
				--font-mono: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas,
					'DejaVu Sans Mono', monospace;
				background: var(--bg-1);
				color: var(--fg-1);
				font-family: var(--font);
				line-height: 1.5;
				margin: 0rem;
				height: calc(100vh - 2rem);
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				text-rendering: optimizeLegibility;
				letter-spacing: -0.01em;
			}

			h3 {
				font-size: 2.0rem;   /* try 0.95rem – 1.2rem */
				line-height: 1.6;
			}

			p {
				font-size: 1.2rem;   /* try 0.95rem – 1.2rem */
				line-height: 1.6;
			}

			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				line-height: 1.15;
				letter-spacing: -0.02em;
			}

			:is(h1, h2, h3, h4, h5, h6, p) {
				margin: 1rem 0.1rem;
			}

			label {
				margin: 0.5rem 0.1rem;
			}

			:is(h1, h2, h3, h4, h5, h6):first-child {
				margin-top: 10;
			}

			:is(p, label):first-child {
				margin-top: 0;
			}

			:is(h1, h2, h3, h4, h5, h6, p, label):last-child {
				margin-bottom: 0;
			}

			a {
				color: var(--link);
			}

			a:hover {
				color: var(--link-hover);
			}

			a:active {
				color: var(--link-active);
			}

			label {
				display: flex;
				gap: 0.5rem;
				align-items: center;
			}

			label input {
				margin: 0;
			}

			button,
			input,
			select {
				font-family: inherit;
				font-size: inherit;
			}

			button {
				background: var(--link);
				color: var(--bg-1);
				padding: 0.6rem 1.25rem;
				border: none;
				border-radius: var(--border-radius);
				font-weight: 600;
				cursor: pointer;
				transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
			}

			button:hover {
				background: var(--link-hover);
				transform: translateY(-1px);
				box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
			}

			button:active {
				background: var(--link-active);
			}

			:is(button, button:hover, button:active):disabled {
				background: var(--link);
				filter: grayscale(1);
				opacity: 0.4;
			}

			input,
			textarea,
			select {
				padding: 0.5rem;
				border: 1px solid var(--bg-2);
				border-radius: var(--border-radius);
				box-sizing: border-box;
			}

			input,
			textarea {
				background: var(--bg-1);
			}

			select:not([multiple]) {
				background: var(--bg-2);
			}

			textarea {
				font-family: var(--font-mono);
				font-size: 0.9rem;
			}

			form {
				display: flex;
				flex-direction: column;
				gap: 1rem;
				align-items: baseline;
			}

			ul:has(li):has(form) {
				list-style: none;
				padding: 0;
			}

			li form {
				flex-direction: row;
				gap: 0.5rem;
				margin: 0.5rem 0;
			}

			nav {
				position: relative;
				display: flex;
				gap: 1em;
				padding: 1em;
				background: var(--bg-2);
				z-index: 2;
				margin: 0 0 1em 0;
				border-radius: var(--border-radius);
			}

			nav a {
				text-decoration: none;
			}

			nav a[aria-current='true'] {
				border-bottom: 2px solid;
			}

			ul:has(form) {
				list-style: none;
				padding: 0;
			}

			progress {
				margin: 0.5rem 0;
			}

			progress:first-child {
				margin-top: 0;
			}

			progress:lsat-child {
				margin-bottom: 0;
			}

			.error {
				color: red;
			}

			code {
				background: var(--bg-2);
				font-family: var(--font-mono);
				font-size: 0.9em;
				padding: 0.15rem 0.3rem;
				border-radius: var(--border-radius);
			}

			ul.todos {
				padding: 0;
			}

			ul.todos li:not(:has(> form)),
			ul.todos li form {
				position: relative;
				display: flex;
				align-items: center;
				padding: 0.5em 0.5em 0.5em 1em;
				margin: 0 0 0.5em 0;
				gap: 0.5em;
				border-radius: 5px;
				user-select: none;
				background: var(--bg-1);
				filter: drop-shadow(2px 3px 6px rgba(0, 0, 0, 0.1));
				transition: filter 0.2s, opacity 0.2s;
			}

			ul.todos .done {
				filter: none;
				opacity: 0.4;
			}

			ul.todos button {
				border: none;
				background-color: transparent;
				background-repeat: no-repeat;
				background-position: 50% 50%;
				background-size: 1rem 1rem;
				cursor: pointer;
				width: 3em;
				height: 3em;
				margin: -0.5em -0.5em -0.5em 0;
				aspect-ratio: 1;
				opacity: 0.5;
				transition: opacity 0.2s;
			}

			ul.todos button:hover {
				opacity: 1;
			}

			body.light {
				--bg-1: hsl(0, 0%, 100%);
				--bg-2: hsl(0, 0%, 100%);
				--bg-3: hsl(0, 0%, 40%);
				--fg-1: hsl(0, 0%, 00%);
				--fg-2: hsl(0, 0%, 70%);
				--fg-3: hsl(0, 0%, 60%);
				--link: hsl(206, 96%, 72%);
				--link-hover: hsl(124, 77%, 55%);				
				--link-active: hsl(206, 96%, 64%);
				
				#logo-icon {
					max-width: 150px;
					max-height: 50px;
					cursor: pointer; /* Sørger for at bildet ser klikkbart ut */
				}
				
				#theme-icon {
					max-width: 25px;
					max-height: 25px;
					cursor: pointer; /* Sørger for at bildet ser klikkbart ut */
				}
			}



			body.dark {
				--bg-1: hsl(0, 0%, 100%);
				--bg-2: hsl(0, 0%, 100%);
				--bg-3: hsl(0, 0%, 40%);
				--fg-1: hsl(0, 0%, 00%);
				--fg-2: hsl(0, 0%, 70%);
				--fg-3: hsl(0, 0%, 60%);
				--link: hsl(206, 96%, 72%);
				--link-hover: hsl(124, 77%, 55%);				
				--link-active: hsl(206, 96%, 64%);

				#logo-icon {
					max-width: 150px;
					max-height: 50px;									
					cursor: pointer; /* Sørger for at bildet ser klikkbart ut */
				}

				#theme-icon {
					max-width: 25px;
					max-height: 25px;
					cursor: pointer; /* Sørger for at bildet ser klikkbart ut */					
				}
			}




			.top-header {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				background: rgba(255, 255, 255, 0.72);
				-webkit-backdrop-filter: saturate(180%) blur(14px);
				backdrop-filter: saturate(180%) blur(14px);
				color: var(--fg-1);
				padding: 0rem;
				z-index: 1000;
				border-bottom: 1px solid rgba(0, 0, 0, 0.06);
				box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
			}

			.top-header-inner {
				display: flex;
				justify-content: center;
				align-items: center;
				max-width: 1920px;
				margin: 0 auto;
				padding: 0.75rem 1rem;
			}

			.top-nav {
				display: flex;
				align-items: center;
				gap: 3rem;
			}

			.top-nav a {
				position: relative;
				text-decoration: none;
				color: var(--fg-1);
				font-size: 0.95rem;
				font-weight: 600;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				padding: 0.25rem 0;
				transition: color 0.2s ease;
			}

			.top-nav a::after {
				content: "";
				position: absolute;
				left: 0;
				bottom: -2px;
				height: 2px;
				width: 100%;
				background: var(--accent);
				transform: scaleX(0);
				transform-origin: left;
				transition: transform 0.5s ease;
			}

			.top-nav a:hover {
				color: var(--accent);
			}

			.top-nav a:hover::after {
				transform: scaleX(1);
			}

			#logo-icon {
				cursor: pointer;
				height: 40px;
				transition: transform 0.2s ease;
			}	

			#logo-icon:hover {
				transform: scale(1.05);
			}




			.bottom-header {
				width: 100%;
				background: var(--bg-2);
				color: var(--fg-1);
				padding: 2rem 1rem;
				border-top: 1px solid rgba(0, 0, 0, 0.06);
				box-shadow: 0 -2px 24px rgba(0, 0, 0, 0.04);
			}

			.bottom-header-inner {
				max-width: 1920px;
				margin: 0 auto;
				display: flex;
				justify-content: center;
			}

			.bottom-nav {
				display: flex;
				gap: 3rem;
				align-items: flex-start;
				flex-wrap: wrap; /* key for tablet */
			}

			.footer-block {
				min-width: 220px;
				line-height: 1.6;
				font-size: 0.95rem;
			}



			
			@media (max-width: 992px) {
				.top-nav {
					gap: 1.5rem;
				}

				.top-nav a {
					font-size: 1rem;
				}

				#logo-icon {
					height: 32px;
				}

				
				.bottom-nav {
					gap: 2rem;
					justify-content: center;
				}

				.footer-block {
					min-width: 200px;
					text-align: center;
				}
			}

			@media (max-width: 576px) {
				.top-nav {
					gap: 1rem;
				}

				.top-nav a {
					font-size: 0.9rem;
				}

				#logo-icon {
					height: 20px;
				}

				
				 .bottom-nav {
					flex-direction: column;
					align-items: center;
					gap: 1.5rem;
				}

				.footer-block {
					text-align: center;
					font-size: 0.9rem;
				}
			}


			
		</style>
	</head>
	<body>
		
		

		<!-- Main Content -->
		<div style="margin-top: 80px; display: contents;"> <!-- Adjust margin-top to avoid overlap with the fixed header -->
			%sveltekit.body%
		</div>
	




		<!-- Script for changing between day and night -->
		<script>
			// Check for saved theme in localStorage
			const savedTheme = localStorage.getItem('theme');
			if (savedTheme) {
			  document.body.classList.add(savedTheme);
			} 
			else {
			  document.body.classList.add('light');
			}

	</body>
</html>
